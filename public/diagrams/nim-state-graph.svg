<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Nim state graph for one pile of five stones</title>
  <desc id="desc">Each state points to every smaller state because a player may remove any positive number of stones. The state and Sprague-Grundy values are equal.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
      <circle cx="1" cy="1" r="1" fill="#00F0FF" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2CBF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#00F0FF"/>
    </marker>
    <style>
      .mono{font-family:"DM Mono","JetBrains Mono",monospace;letter-spacing:1px}
      .edge{fill:none;stroke:url(#edge);stroke-width:1.4;stroke-opacity:.58;marker-end:url(#arrow)}
      .flow{stroke-dasharray:7 9;animation:flow 9s linear infinite}
      .node{fill:#0D0E15;stroke:#8A8F9E;stroke-opacity:.62;stroke-width:1.3}
      .node-ring{fill:none;stroke:#00F0FF;stroke-opacity:.18}
      .state{fill:#F4F7FA;font-size:22px;text-anchor:middle}
      .sg{fill:#8A8F9E;font-size:12px;text-anchor:middle}
      @keyframes flow{to{stroke-dashoffset:-128}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="620" fill="#050508"/>
  <rect x="20" y="20" width="1160" height="580" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M20 84H1180M255 20V84" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="48" y="58" class="mono" fill="#00F0FF" font-size="14">STATE SPACE / NIM(5)</text>
  <text x="278" y="58" class="mono" fill="#8A8F9E" font-size="12">REMOVE ANY POSITIVE NUMBER</text>
  <text x="1152" y="58" class="mono" fill="#8A8F9E" font-size="11" text-anchor="end">x -> y, 0 &lt;= y &lt; x</text>

  <g aria-label="All legal transitions">
    <path class="edge flow" d="M151 425C400 90 950 90 1049 425"/>
    <path class="edge flow" d="M151 428C320 145 800 145 857 428"/>
    <path class="edge flow" d="M151 431C260 210 600 210 665 431"/>
    <path class="edge flow" d="M151 434C230 270 425 270 473 434"/>
    <path class="edge flow" d="M151 438C190 350 245 350 281 438"/>

    <path class="edge flow" d="M343 428C500 145 950 145 1049 428"/>
    <path class="edge flow" d="M343 431C440 210 790 210 857 431"/>
    <path class="edge flow" d="M343 434C410 270 620 270 665 434"/>
    <path class="edge flow" d="M343 438C373 350 438 350 473 438"/>

    <path class="edge flow" d="M535 431C650 210 980 210 1049 431"/>
    <path class="edge flow" d="M535 434C610 270 810 270 857 434"/>
    <path class="edge flow" d="M535 438C565 350 630 350 665 438"/>

    <path class="edge flow" d="M727 434C820 270 1000 270 1049 434"/>
    <path class="edge flow" d="M727 438C757 350 822 350 857 438"/>
    <path class="edge flow" d="M919 438C949 350 1014 350 1049 438"/>
  </g>

  <g aria-label="States and Sprague-Grundy values">
    <g transform="translate(120 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">5</text><text class="mono sg" y="67">SG=5</text></g>
    <g transform="translate(312 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">4</text><text class="mono sg" y="67">SG=4</text></g>
    <g transform="translate(504 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">3</text><text class="mono sg" y="67">SG=3</text></g>
    <g transform="translate(696 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">2</text><text class="mono sg" y="67">SG=2</text></g>
    <g transform="translate(888 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">1</text><text class="mono sg" y="67">SG=1</text></g>
    <g transform="translate(1080 455)" filter="url(#glow)"><circle r="42" fill="none" stroke="#FF3366" stroke-opacity=".36"/><circle r="31" fill="#130B15" stroke="#FF3366" stroke-width="1.5"/><text class="mono state" y="7">0</text><text class="mono sg" y="67" fill="#FF7798">SG=0 / TERMINAL</text></g>
  </g>

  <g class="mono" font-size="11">
    <circle cx="49" cy="570" r="3" fill="#00F0FF"/>
    <text x="61" y="574" fill="#8A8F9E">DIRECTED EDGE = ONE LEGAL MOVE</text>
    <text x="1152" y="574" fill="#7B2CBF" text-anchor="end">SG(x) = mex { SG(y) | x -> y }</text>
  </g>
</svg>
