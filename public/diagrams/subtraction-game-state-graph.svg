<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">State graph for removing one or two stones</title>
  <desc id="desc">A pile begins with five stones. Solid cyan arrows remove one stone and dashed violet arrows remove two. States zero and three have Sprague-Grundy value zero.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
      <circle cx="1" cy="1" r="1" fill="#00F0FF" fill-opacity="0.12"/>
    </pattern>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#00F0FF"/>
    </marker>
    <marker id="violetArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#AE6DE2"/>
    </marker>
    <style>
      .mono{font-family:"DM Mono","JetBrains Mono",monospace;letter-spacing:1px}
      .minus-one{fill:none;stroke:#00F0FF;stroke-opacity:.72;stroke-width:1.6;marker-end:url(#cyanArrow)}
      .minus-two{fill:none;stroke:#AE6DE2;stroke-opacity:.72;stroke-width:1.6;stroke-dasharray:8 8;marker-end:url(#violetArrow);animation:flow 7s linear infinite}
      .node{fill:#0D0E15;stroke:#8A8F9E;stroke-opacity:.62;stroke-width:1.3}
      .node-ring{fill:none;stroke:#00F0FF;stroke-opacity:.18}
      .zero-ring{fill:none;stroke:#FF3366;stroke-opacity:.46;stroke-width:1.4}
      .state{fill:#F4F7FA;font-size:22px;text-anchor:middle}
      .sg{fill:#8A8F9E;font-size:12px;text-anchor:middle}
      @keyframes flow{to{stroke-dashoffset:-128}}
      @media (prefers-reduced-motion:reduce){.minus-two{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="620" fill="#050508"/>
  <rect x="20" y="20" width="1160" height="580" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M20 84H1180M255 20V84" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="48" y="58" class="mono" fill="#00F0FF" font-size="14">STATE SPACE / SUBTRACTION GAME</text>
  <text x="326" y="58" class="mono" fill="#8A8F9E" font-size="12">MOVE SET {1, 2}</text>
  <text x="1152" y="58" class="mono" fill="#8A8F9E" font-size="11" text-anchor="end">INITIAL STATE x=5</text>

  <g aria-label="Remove two transitions">
    <path class="minus-two" d="M151 423C230 202 425 202 473 423"/>
    <path class="minus-two" d="M343 423C422 202 617 202 665 423"/>
    <path class="minus-two" d="M535 423C614 202 809 202 857 423"/>
    <path class="minus-two" d="M727 423C806 202 1001 202 1049 423"/>
  </g>
  <g aria-label="Remove one transitions">
    <path class="minus-one" d="M153 455H279"/>
    <path class="minus-one" d="M345 455H471"/>
    <path class="minus-one" d="M537 455H663"/>
    <path class="minus-one" d="M729 455H855"/>
    <path class="minus-one" d="M921 455H1047"/>
  </g>

  <g aria-label="States and Sprague-Grundy values">
    <g transform="translate(120 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">5</text><text class="mono sg" y="67">SG=2</text></g>
    <g transform="translate(312 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">4</text><text class="mono sg" y="67">SG=1</text></g>
    <g transform="translate(504 455)" filter="url(#cyanGlow)"><circle class="zero-ring" r="42"/><circle r="31" fill="#130B15" stroke="#FF3366" stroke-width="1.5"/><text class="mono state" y="7">3</text><text class="mono sg" y="67" fill="#FF7798">SG=0 / P</text></g>
    <g transform="translate(696 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">2</text><text class="mono sg" y="67">SG=2</text></g>
    <g transform="translate(888 455)"><circle class="node-ring" r="42"/><circle class="node" r="31"/><text class="mono state" y="7">1</text><text class="mono sg" y="67">SG=1</text></g>
    <g transform="translate(1080 455)" filter="url(#cyanGlow)"><circle class="zero-ring" r="42"/><circle r="31" fill="#130B15" stroke="#FF3366" stroke-width="1.5"/><text class="mono state" y="7">0</text><text class="mono sg" y="67" fill="#FF7798">SG=0 / TERMINAL</text></g>
  </g>

  <g class="mono" font-size="11">
    <path d="M48 568H80" class="minus-one"/>
    <text x="92" y="573" fill="#8A8F9E">REMOVE 1</text>
    <path d="M204 568H236" class="minus-two"/>
    <text x="248" y="573" fill="#8A8F9E">REMOVE 2</text>
    <text x="1152" y="573" fill="#FF7798" text-anchor="end">P-POSITIONS: SG=0</text>
  </g>
</svg>
